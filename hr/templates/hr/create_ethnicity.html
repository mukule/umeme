{% extends 'main/base.html' %}
{% load crispy_forms_tags %}
{% load static %}

{% block content %}
    <div class="container" style="margin-top: 100px !important;">
        <div class="col-12 mt-4">
            <div class="page-title-box d-flex align-items-center justify-content-between">
                <h4 class="mb-0 font-size-18">Dashboard/Ethnicities/{% if jd %} Update {{jd.name}} {% else %} Create {% endif %}</h4>
    
                <div class="page-title-right">
                    <ol class="breadcrumb m-0">
                        <li class="breadcrumb-item"><a href="{% url 'hr:dashboard' %}">Dashboard/</a> <a href="{% url 'hr:ethnicities' %}">Ethnicities</a></li>
                    </ol>
                </div>
            </div>
        </div>
        <hr>
        <div class="row">
            <div class="col-xl-12">
                <div class="card">
                    <div class="card-body">
                        <form method="post">
                            {% csrf_token %}
                            <div class="form-group">
                                <label for="{{ form.name.id_for_label }}" class="col-form-label">Ethnicity Group Name</label>
                                {{ form.name|as_crispy_field }}
                            </div>
                          
                            <div class="text-center">
                                <button type="submit" class="btn" style="background-color: #490ca6; color: #fff;">Submit<button>
                                <a href="{% url 'hr:ethnicities' %}" class="btn" style="background-color: #490ca6; color: #fff;">Back to Ethnicities</a>
                            </div>
                        </form>
                    </div>
                    <!-- end card-body -->
                </div>
                <!-- end card -->
            </div>
            <!-- end col -->
        </div>
        
        
       <!--end row-->
    </div>
{% endblock content %}
