{% extends 'main/base.html' %}
{% load static %}

{% block content %}
<div class="container" style="margin-top: 100px !important;">
    <div class="col-12 mt-4">
        <div class="page-title-box d-flex align-items-center justify-content-between">
            <h4 class="mb-0 font-size-18">Dashboard/Terms and Conditions</h4>

            <div class="page-title-right">
                <ol class="breadcrumb m-0">
                    <li class="breadcrumb-item">
                        <a href="{% url 'hr:dashboard' %}">Dashboard/</a>
                        <a href="{% url 'hr:terms' %}">Terms and Conditions</a>
                    </li>
                </ol>
            </div>
        </div>
    </div>
    <hr>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Terms and Conditions Details</h5>
                        <p><strong>Term Type:</strong> {{ term.get_term_type_display }}</p>
                        <p><strong>Content:</strong></p>
                        <div>{{ term.text|safe }}</div>
                        <a href="{% url 'hr:edit_terms' term.id %}" class="btn btn-primary mt-3">Edit Terms</a>
                        <a href="{% url 'hr:terms' %}" class="btn btn-secondary mt-3">Back</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
